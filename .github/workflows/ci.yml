name: CI

on:
  push:
    branches: [ main, develop, feature/*, claude/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.7.1
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Install project
      run: poetry install --no-interaction

    - name: Validate project structure
      run: python scripts/validate.py

    - name: Run code formatting check (black)
      run: poetry run black --check src tests

    - name: Run linting (ruff)
      run: poetry run ruff check src tests

    - name: Run type checking (mypy)
      run: poetry run mypy src
      continue-on-error: true  # Don't fail on type errors initially

    - name: Run unit tests
      run: poetry run pytest tests/unit -v --cov --cov-report=term

    - name: Run integration tests
      run: poetry run pytest tests/integration -v --cov --cov-append --cov-report=term

    - name: Run performance tests (info only)
      run: poetry run pytest tests/test_performance.py -v --durations=5
      continue-on-error: true

    - name: Generate final coverage report
      run: poetry run pytest --cov --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Poetry
      uses: snok/install-poetry@v1

    - name: Install dependencies
      run: poetry install

    - name: Check code formatting
      run: poetry run black --check .

    - name: Lint with ruff
      run: poetry run ruff check .
