name: CI

# Pull requests run on any base: in a stack, each PR targets the branch below it.
# Branch pushes without a PR don't run (they used to, doubling every stacked PR);
# master runs on every push and is never cancelled, so each merge gets a result.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install project
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      # The other pre-commit hooks: workflow security (zizmor) and correctness
      # (actionlint), YAML/TOML syntax, whitespace. Ruff ran above, from the lockfile.
      - name: Pre-commit hooks
        env:
          SKIP: ruff-check,ruff-format
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --locked

      - name: Test
        if: ${{ !(runner.os == 'Linux' && matrix.python-version == '3.12') }}
        run: uv run pytest

      # One cell measures coverage (lines and branches, including the MCP server
      # subprocesses), enforces the floor in pyproject.toml and puts the table in
      # the job summary.
      - name: Test with coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: uv run pytest --cov --cov-report=term-missing --cov-report="markdown-append:$GITHUB_STEP_SUMMARY"

  # uvx picks uv's newest Python whatever the package supports, so the published
  # commands pass --python 3.14. Check that every dependency installs from wheels on
  # the oldest and the pinned Python, on each platform, and that server.json (which
  # carries the pin for MCP registry clients) matches the registry's schema.
  wheels:
    name: wheels (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Dependencies resolve to wheels only
        shell: bash
        run: |
          for platform in x86_64-manylinux_2_28 aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            echo "::group::$platform"
            uv pip compile pyproject.toml --quiet --no-header --only-binary :all: \
              --python-version "${{ matrix.python-version }}" --python-platform "$platform"
            echo "::endgroup::"
          done

      - name: server.json matches the MCP registry schema
        if: matrix.python-version == '3.14'
        run: uvx check-jsonschema --schemafile https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json server.json

  # Build the wheel, install it the way a user would (fresh environment, newest
  # compatible dependencies from PyPI, not the lockfile) and smoke-test the
  # installed command and MCP server.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          uv venv .smoke --python 3.12
          uv pip install --python .smoke dist/*.whl

      # The published launch command: uvx with --python 3.14, nothing built from
      # source. setup-uv sets UV_PYTHON, which would hide a missing --python.
      - name: Run the wheel the way the docs launch it
        shell: bash
        run: env -u UV_PYTHON uvx --no-build --python 3.14 --from "$(ls dist/*.whl)" pubchem-finder --version

      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bin=.smoke/Scripts; else bin=.smoke/bin; fi
          "$bin/python" scripts/smoke.py --command "$bin/pubchem-finder"
          PUBCHEM_FINDER_COMMAND="$bin/pubchem-finder" "$bin/python" examples/mcp_client.py

      # tests/e2e/test_http.py covers the HTTP transport from the source tree; this
      # runs the same checks against the installed wheel with the newest dependencies.
      - name: Smoke test over HTTP
        if: runner.os == 'Linux'
        shell: bash
        run: |
          .smoke/bin/pubchem-finder mcp --transport http --port 8765 2> http-server.log &
          trap 'kill $! 2> /dev/null; echo "--- server log ---"; cat http-server.log' EXIT
          for _ in $(seq 1 90); do curl -fs http://127.0.0.1:8765/health > /dev/null && break; sleep 1; done
          .smoke/bin/python scripts/smoke.py --url http://127.0.0.1:8765/mcp

  # The one check branch protection requires: it passes only if every job above
  # passed, so adding or renaming matrix cells never breaks the ruleset.
  ci-ok:
    if: always()
    needs: [lint, test, wheels, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then echo "::error::a job ended $result"; exit 1; fi
          done
