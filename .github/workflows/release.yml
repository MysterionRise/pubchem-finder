name: Release

# Run from the Actions tab: "Release" -> "Run workflow", or
#   gh workflow run release.yml -f version=x.y.z                  (dry run)
#   gh workflow run release.yml -f version=x.y.z -f dry_run=false (from master)
# Prepare the files first with `make release-prep VERSION=x.y.z`; docs/releasing.md
# is the runbook, with what to do when a step fails.
#
# A dry run (the default) builds, tests and checks the package from any branch and
# runs the real-data end-to-end check. A real run only starts from master, on a
# commit whose CI passed. It tags the commit and drafts the GitHub Release first
# (cheap, undoable), then publishes to PyPI with trusted publishing (the pypi
# environment needs approval), then publishes the release, lists the version in
# the MCP registry and pushes a branch that points the Claude plugin at it.
# Every job can be re-run on its own.
#
# One-time setup on pypi.org (Account -> Publishing -> Add a pending publisher):
# project pubchem-finder, owner MysterionRise, repository pubchem-finder,
# workflow release.yml, environment pypi.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match pyproject.toml)"
        required: true
      dry_run:
        description: "Build and test only; do not publish"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # the CI gate reads this commit's CI runs
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 2.1.1, not '$VERSION'"; exit 1
          fi
          if [ "$DRY_RUN" != true ]; then
            if [ "$GITHUB_REF" != refs/heads/master ]; then
              echo "::error::real releases run from master, not $GITHUB_REF"; exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error::$GITHUB_SHA is not on master"; exit 1
            fi
          fi
          # Wait (up to 25 minutes) for CI on this exact commit.
          for _ in $(seq 1 50); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$GITHUB_SHA" --json status,conclusion)
            if jq -e 'any(.[]; .conclusion == "success")' <<< "$runs" > /dev/null; then
              echo "CI passed on $GITHUB_SHA"; exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<< "$runs" > /dev/null; then
              break
            fi
            sleep 30
          done
          message="no successful CI run on $GITHUB_SHA (start one: gh workflow run ci.yml --ref ${GITHUB_REF#refs/heads/})"
          if [ "$DRY_RUN" = true ]; then echo "::warning::$message"; else echo "::error::$message"; exit 1; fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"

      - name: Versions, changelog and citation agree
        run: uv run --no-project python scripts/release_prep.py check "$VERSION" --notes release-notes.md

      - name: Not released yet
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha 2> /dev/null || true)
          on_pypi=false
          if curl -fs -o /dev/null "https://pypi.org/pypi/pubchem-finder/$VERSION/json"; then on_pypi=true; fi
          problem=""
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            problem="tag v$VERSION already points at $tag_sha"
          elif [ "$on_pypi" = true ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            problem="pubchem-finder $VERSION is already on PyPI"
          elif [ -n "$tag_sha" ]; then
            echo "::notice::v$VERSION is already tagged on this commit: resuming a release"
          fi
          if [ -n "$problem" ]; then
            if [ "$DRY_RUN" = true ]; then echo "::warning::$problem"; else echo "::error::$problem"; exit 1; fi
          fi

      - name: Lint, type-check and test
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Package metadata
        run: |
          uvx twine==7.0.0 check --strict dist/*
          test -f "dist/pubchem_finder-$VERSION-py3-none-any.whl"
          name=$(jq -r .name server.json)
          # The MCP registry proves PyPI ownership with this line in the description.
          unzip -p dist/*.whl '*.dist-info/METADATA' | grep -Fxq "<!-- mcp-name: $name -->"
          tar -xzOf dist/*.tar.gz --wildcards '*/PKG-INFO' | grep -Fxq "<!-- mcp-name: $name -->"
          uvx check-jsonschema --schemafile \
            https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json server.json

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv .smoke --python 3.12
          uv pip install --python .smoke dist/*.whl
          .smoke/bin/python scripts/smoke.py --command .smoke/bin/pubchem-finder

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  # Dry runs also build a real index from PubChem's first SDF chunk and run every
  # command against it (about 7 minutes).
  e2e:
    needs: build
    if: ${{ inputs.dry_run }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-real.yml
    with:
      chunks: "1"

  # Cheap, undoable steps before the one that can't be undone (PyPI).
  prepare-release:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Tag the commit
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha 2> /dev/null || true)
          if [ -z "$tag_sha" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
          elif [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "::error::tag v$VERSION points at $tag_sha, not $GITHUB_SHA"; exit 1
          fi

      - name: Draft the GitHub Release
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release v$VERSION exists: resuming"; exit 0
          fi
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --draft --title "v$VERSION" --notes-file release-notes.md

  publish:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/pubchem-finder/${{ inputs.version }}/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true # a re-run after a partial upload is safe

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the GitHub Release
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # The MCP registry (registry.modelcontextprotocol.io) lists the server from
  # server.json. It checks that the PyPI release exists and that the package
  # description (the README) carries the "mcp-name" marker, so this runs after
  # PyPI serves the release; a failure here leaves PyPI, the tag and the GitHub
  # Release intact and the job can be re-run on its own.
  mcp-registry:
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # proves ownership of io.github.MysterionRise/* through GitHub OIDC
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      MCP_PUBLISHER_VERSION: v1.8.5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Wait until PyPI serves the release with the registry marker
        run: |
          for _ in $(seq 1 30); do
            if curl -fs "https://pypi.org/pypi/pubchem-finder/$VERSION/json" \
                | grep -q "mcp-name: io.github.MysterionRise/pubchem-finder"; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::PyPI does not serve pubchem-finder $VERSION with the mcp-name marker yet"
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
