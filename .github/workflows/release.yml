name: Release

# Run from the Actions tab: "Release" -> "Run workflow".
# With dry_run (the default) it only builds and tests the package. Without it, it
# publishes to PyPI with trusted publishing, then tags the commit and creates the
# GitHub Release with the CHANGELOG section as notes.
#
# One-time setup on pypi.org (Account -> Publishing -> Add a pending publisher):
# project pubchem-finder, owner MysterionRise, repository pubchem-finder,
# workflow release.yml, environment pypi.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match pyproject.toml)"
        required: true
      dry_run:
        description: "Build and test only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"

      - name: Check the version and changelog
        run: |
          project=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$project" != "$VERSION" ]; then
            echo "::error::pyproject.toml says $project, not $VERSION"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1
          fi
          uv run --no-project python - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          server = json.load(open("server.json"))
          found = {
              "server.json": server["version"],
              **{f"server.json packages[{i}]": p["version"] for i, p in enumerate(server["packages"])},
              "plugin.json": json.load(open("plugins/pubchem-finder/.claude-plugin/plugin.json"))["version"],
              "marketplace.json": json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"],
          }
          if wrong := {k: v for k, v in found.items() if v != version}:
              print(f"::error::not at {version}: {wrong}"); sys.exit(1)
          PY
          cff=$(sed -n 's/^version: *//p' CITATION.cff)
          if [ "$cff" != "$VERSION" ]; then
            echo "::error::CITATION.cff says $cff, not $VERSION"; exit 1
          fi
          if ! grep -q '^date-released: "20' CITATION.cff; then
            echo "::error::CITATION.cff has no date-released"; exit 1
          fi

      - name: Lint, type-check and test
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv .smoke --python 3.12
          uv pip install --python .smoke dist/*.whl
          .smoke/bin/python scripts/smoke.py --command .smoke/bin/pubchem-finder

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  publish:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pubchem-finder/${{ inputs.version }}/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Tag and create the GitHub Release
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md

  # The MCP registry (registry.modelcontextprotocol.io) lists the server from
  # server.json. It checks that the PyPI release exists and that the package
  # description (the README) carries the "mcp-name" marker, so this runs last,
  # after PyPI serves the release; a failure here leaves PyPI, the tag and the
  # GitHub Release intact and the job can be re-run on its own.
  mcp-registry:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # proves ownership of io.github.MysterionRise/* through GitHub OIDC
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      MCP_PUBLISHER_VERSION: v1.8.5
    steps:
      - uses: actions/checkout@v7

      - name: Wait until PyPI serves the release with the registry marker
        run: |
          for _ in $(seq 1 30); do
            if curl -fs "https://pypi.org/pypi/pubchem-finder/$VERSION/json" \
                | grep -q "mcp-name: io.github.MysterionRise/pubchem-finder"; then
              exit 0
            fi
            sleep 20
          done
          echo "::error::PyPI does not serve pubchem-finder $VERSION with the mcp-name marker yet"
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Publish to the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
