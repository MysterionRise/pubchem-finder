name: Live PubChem

# The unit tests run offline against recorded responses. This workflow runs the
# tests marked `live` against the real PubChem services, on demand and weekly,
# so a change on PubChem's side shows up here before users hit it.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install project
        run: uv sync --locked

      - name: Live tests
        env:
          PUBCHEM_LIVE: "1"
        run: uv run pytest -m live -v
