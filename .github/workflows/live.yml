name: Live PubChem

# The unit tests run offline against recorded responses. This workflow runs the
# tests marked `live` against the real PubChem services, on demand and weekly,
# so a change on PubChem's side shows up here before users hit it.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install project
        run: uv sync --locked

      - name: Live tests
        env:
          PUBCHEM_LIVE: "1"
        run: uv run pytest -m live -v

  report:
    needs: live
    if: always() && github.event_name == 'schedule'
    permissions:
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
    with:
      title: "The weekly live PubChem tests are failing"
      result: ${{ needs.live.result }}
