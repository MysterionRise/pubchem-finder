version: '3.8'

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: pubchem-finder:dev
    container_name: pubchem-finder-dev
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
    environment:
      - PYTHONUNBUFFERED=1
    command: bash
    stdin_open: true
    tty: true

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: pubchem-finder:dev
    container_name: pubchem-finder-test
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./htmlcov:/app/htmlcov
    command: pytest --cov --cov-report=html --cov-report=term -v

  test-watch:
    build:
      context: .
      dockerfile: Dockerfile
    image: pubchem-finder:dev
    container_name: pubchem-finder-test-watch
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    command: pytest-watch -- --cov -v
