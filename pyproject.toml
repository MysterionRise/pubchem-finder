[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pubchem-finder"
version = "2.0.0a0"
description = "Molecular similarity search over PubChem: local index, CLI and MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Konstantin Perikov" }]
keywords = ["cheminformatics", "pubchem", "rdkit", "similarity-search", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "rdkit>=2024.9",
    "numpy>=2",
    "httpx>=0.28",
    "pydantic>=2.7",
    "typer>=0.15",
    "mcp>=2.3,<3",
    "platformdirs>=4",
]

[project.scripts]
pubchem-finder = "pubchem_finder.cli:run"

[project.urls]
Homepage = "https://github.com/MysterionRise/pubchem-finder"
Issues = "https://github.com/MysterionRise/pubchem-finder/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pubchem_finder"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (formatter handles it)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true
files = ["src"]

[[tool.mypy.overrides]]
module = "rdkit.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "live: tests that call the real PubChem API (set PUBCHEM_LIVE=1)",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
