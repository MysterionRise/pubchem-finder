[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pubchem-finder"
version = "2.1.1"
description = "Search PubChem by chemical structure: a local similarity and substructure index, live PubChem tools, a CLI and an MCP server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Konstantin Perikov" }]
keywords = ["cheminformatics", "pubchem", "rdkit", "similarity-search", "substructure-search", "mcp", "mcp-server", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "rdkit>=2024.9",
    "numpy>=2",
    "httpx>=0.28",
    "pydantic>=2.7",
    "typer>=0.16",  # 0.15 breaks on usage errors with click 8.2+
    "mcp>=2.3,<3",
    "platformdirs>=4",
    "fpsim2>=0.7.4",
    "tables>=3.10",  # FPSim2's storage; read directly when sorting index files
    "duckdb>=1.1",
    "pyarrow>=17",
    "pillow>=10.1",  # ImageFont.load_default(size=...)
    "psutil>=5.9",
    "starlette>=1",
]

[project.scripts]
pubchem-finder = "pubchem_finder.cli:run"

[project.urls]
Homepage = "https://github.com/MysterionRise/pubchem-finder"
Changelog = "https://github.com/MysterionRise/pubchem-finder/blob/master/CHANGELOG.md"
Issues = "https://github.com/MysterionRise/pubchem-finder/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.22",
    "pre-commit>=4.7.0",
    "types-psutil>=7.2.2.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pubchem_finder"]

[tool.hatch.build.targets.sdist]
# Keep the demo media, the plugin and CI files out of the source distribution.
exclude = ["docs/media", "docs/images", ".github", ".claude-plugin", "plugins"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "S",   # flake8-bandit (security)
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501",  # line too long (formatter handles it)
]

[tool.ruff.lint.isort]
known-first-party = ["pubchem_finder", "tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Tests assert, start our own server as a subprocess, bind to 0.0.0.0 to check the
# warning, and compute MD5 the way PubChem publishes its checksums.
"tests/**" = ["S101", "S603", "S104", "S324"]
# Scripts check results with assert and run our own commands.
"scripts/**" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "scripts", "examples"]

[[tool.mypy.overrides]]
module = "rdkit.*"
ignore_missing_imports = true

# No type information published for these.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "tables.*", "FPSim2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "live: tests that call the real PubChem API (set PUBCHEM_LIVE=1)",
]

[tool.coverage.run]
source = ["src"]
branch = true
# The end-to-end tests run the MCP server as a subprocess (stdio and HTTP);
# measure it too. The HTTP server is stopped with SIGTERM.
patch = ["subprocess"]
sigterm = true

[tool.coverage.report]
# Measured 96.8% (lines and branches, server subprocesses included) in October
# 2026; the floor sits a point below so refactors have room, not untested code.
fail_under = 95
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
